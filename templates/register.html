{% extends "base.html" %}
{% block title %}Register — SEAT SYNC{% endblock %}
{% block head %}
<style>
.auth-wrap { min-height:85vh; display:flex; align-items:center; justify-content:center; padding:2rem; }
.auth-card { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:2.5rem; width:100%; max-width:480px; box-shadow:var(--shadow); }
.auth-logo { text-align:center; margin-bottom:2rem; }
.auth-logo .logo-text { font-size:2rem; font-weight:900; background:linear-gradient(135deg,var(--primary),var(--secondary)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.auth-logo p { color:var(--text2); font-size:0.9rem; margin-top:0.3rem; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
</style>
{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-text">💺❤️ SEAT SYNC</div>
      <p>Create your seating profile.</p>
    </div>
    <form method="POST">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" class="form-control" placeholder="Your name" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" class="form-control" placeholder="you@college.edu" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" class="form-control" placeholder="Min 6 characters" required minlength="6">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Department</label>
          <select name="department" class="form-control">
            <option>CSE</option><option>ECE</option><option>ME</option><option>IT</option><option>Civil</option>
          </select>
        </div>
        <div class="form-group">
          <label>Year</label>
          <select name="year" class="form-control">
            <option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Class</label>
        <input type="text" name="class_name" class="form-control" placeholder="e.g. CSE-A">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Create Account 💺</button>
    </form>
    <div style="text-align:center;margin-top:1.2rem;color:var(--text2);font-size:0.9rem;">
      Already have an account? <a href="{{ url_for('login') }}">Login</a>
    </div>
  </div>
</div>
{% endblock %}
