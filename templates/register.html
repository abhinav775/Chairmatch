{% extends 'base.html' %}
{% block title %}Register · CHAIR-MATCH{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card auth-card-wide">
    <div class="auth-logo">💺❤️</div>
    <h1>Create Your Profile</h1>
    <p class="auth-sub">Your chair soulmate is waiting.</p>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="POST" class="auth-form">
      <div class="form-row">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="name" placeholder="Your name" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" placeholder="you@college.edu" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Department</label>
          <input type="text" name="department" placeholder="CSE, ECE, IT..." required>
        </div>
        <div class="form-group">
          <label>Year</label>
          <select name="year" required>
            <option value="1">1st Year</option>
            <option value="2">2nd Year</option>
            <option value="3">3rd Year</option>
            <option value="4">4th Year</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Class</label>
        <input type="text" name="class_name" placeholder="A, B, C..." required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Start Matching 💘</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
  </div>
</div>
{% endblock %}
